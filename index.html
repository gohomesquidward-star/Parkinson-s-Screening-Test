<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DriftWatch: personal-baseline early screening prototype</title>
<style>
:root{
  --ink:#0B2545; --ink2:#3C4E63; --mist:#EEF3F7; --paper:#fff; --line:#CFDBE6;
  --teal:#0A7A75; --tealD:#086561; --tealT:#E2F3F2; --violet:#5B3FA8;
  --green:#23744A; --greenBar:#3FA06A; --greenTint:#E4F3EA;
  --amber:#9A5B00; --amberBar:#D9901A; --amberTint:#FBEFD9;
  --red:#B83227; --redBar:#D2493C; --redTint:#F9E3E0;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--mist);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.55}
.wrap{max-width:600px;margin:0 auto;padding:14px 18px 36px}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px;border-radius:6px}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 0 12px}
.brand{font-family:var(--serif);font-weight:700;font-size:21px;line-height:1.15}
.brand small{display:block;font-family:var(--sans);font-weight:500;font-size:13px;color:var(--ink2)}
.tabs{display:flex;gap:6px;background:var(--paper);border:1.5px solid var(--ink);border-radius:999px;padding:4px;margin:0 0 16px}
.tabs button{flex:1;border:0;background:transparent;font:inherit;font-weight:600;font-size:16px;padding:9px 12px;border-radius:999px;color:var(--ink);cursor:pointer;min-height:44px}
.tabs button[aria-selected="true"]{background:var(--ink);color:#fff}

h1,h2,h3{font-family:var(--serif);line-height:1.15;letter-spacing:-.01em;margin:0}
h1{font-size:clamp(28px,8vw,40px);margin:6px 0 10px}
h2{font-size:27px;margin:2px 0 8px}
h3{font-size:19px;margin:0 0 4px}
.lead{font-size:18px;color:var(--ink2);margin:0 0 16px}
p{margin:0 0 12px}
.fine{font-size:14px;color:var(--ink2);margin:8px 0 0}

.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin:0 0 14px}
.panel p:last-child{margin-bottom:0}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0 4px}
.btn{font:inherit;font-weight:600;font-size:17px;min-height:52px;padding:12px 24px;border-radius:999px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--tealD);border-color:var(--tealD)}
.btn.small{min-height:44px;padding:8px 16px;font-size:15px}
.btn.text{border-color:transparent;background:transparent;text-decoration:underline;padding:10px 8px;min-height:44px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.msg{min-height:1.4em;color:var(--red);font-weight:600;margin:10px 0 0}

.hero{display:grid;grid-template-columns:92px 1fr;gap:14px;align-items:center;margin:4px 0 12px}
.hero svg{width:92px;height:92px}
.hero .ghost{fill:none;stroke:var(--line);stroke-width:2.2;stroke-dasharray:1 5;stroke-linecap:round}
.hero .draw{fill:none;stroke:var(--teal);stroke-width:3;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.4s cubic-bezier(.3,.6,.3,1) .15s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.hero .draw{animation:none;stroke-dashoffset:0}}

.check{display:flex;gap:12px;align-items:flex-start;margin:6px 0 4px;cursor:pointer}
.check input{width:24px;height:24px;margin-top:2px;accent-color:var(--teal);flex:none}
details.presenter{margin-top:22px;font-size:15px;color:var(--ink2)}
details.presenter summary{cursor:pointer;padding:6px 0}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 12px}
.tile{text-align:left;font:inherit;padding:14px 14px 12px;border-radius:16px;border:2px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;min-height:118px;display:flex;flex-direction:column;gap:2px}
.tile b{font-family:var(--serif);font-size:19px;line-height:1.2}
.tile span{font-size:14px;color:var(--ink2)}
.tile .st{margin-top:auto;font-weight:700;font-size:14px;color:var(--ink2)}
.tile.done{border-color:var(--teal);background:var(--tealT)}
.tile.done .st{color:var(--tealD)}

.scope{background:var(--ink);border-radius:14px;padding:10px;margin:0 0 12px}
.scope canvas{display:block;width:100%;height:150px}
.status{color:#BFE9E5;font-size:15px;min-height:1.5em;padding:2px 4px 0}
.timer{display:flex;align-items:center;gap:12px;margin:0 0 4px}
.bar{flex:1;height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--teal)}
.secs{font-family:var(--serif);font-size:26px;min-width:5.5em;text-align:right;font-variant-numeric:tabular-nums}
.secs small{font-family:var(--sans);font-size:14px;color:var(--ink2)}

.spiralbox{background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:8px;margin:0 0 10px;display:flex;justify-content:center}
.spiralbox canvas{touch-action:none;cursor:crosshair;border-radius:10px;background:#fff;display:block}
.taps{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:8px 0 12px;user-select:none;-webkit-user-select:none}
.tapbtn{aspect-ratio:1/1;border-radius:50%;border:4px solid var(--line);background:var(--paper);color:var(--ink2);touch-action:manipulation;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tapbtn.next{border-color:var(--teal);background:var(--tealT)}
.tapbtn:active{transform:scale(.97)}
.hint{font-size:16px;color:var(--ink2);text-align:center;margin:0 0 8px}

.qcount{color:var(--ink2);font-size:15px;margin:0 0 6px}
.qtext{font-family:var(--serif);font-size:24px;line-height:1.3;margin:0 0 16px}
.opts{display:grid;gap:10px}
.opt{font:inherit;font-size:19px;font-weight:600;text-align:left;padding:16px 18px;min-height:58px;border-radius:14px;border:2px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.opt[aria-checked="true"]{border-color:var(--teal);background:var(--tealT)}

.done{background:var(--greenTint);border-radius:14px;padding:14px 16px;margin:10px 0 0}
.done strong{display:block;color:var(--green)}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 16px;margin:6px 0 0;font-size:15px}
.kv dt{color:var(--ink2)} .kv dd{margin:0;font-variant-numeric:tabular-nums;font-weight:600;text-align:right}

.banner{border-radius:14px;padding:14px 16px;margin:0 0 14px;font-weight:600}
.banner small{display:block;font-weight:500;margin-top:4px}
.banner.building,.banner.ready{background:var(--paper);border:1px solid var(--line);color:var(--ink)}
.banner.stable{background:var(--greenTint);color:var(--green)}
.banner.watch{background:var(--amberTint);color:var(--amber)}
.banner.review{background:var(--redTint);color:var(--red)}
.banner.sim{background:var(--amberTint);color:var(--amber);font-weight:600}

.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 12px}
.controls label{font-size:15px;color:var(--ink2)}
select{font:inherit;padding:9px 12px;border-radius:10px;border:1.5px solid var(--ink);background:#fff;color:var(--ink);min-height:44px}
.dgrid{display:grid;gap:10px;margin:0 0 14px}
.dcard{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.dcard.flag{border-color:var(--redBar);background:#FFF9F8}
.dhead{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.dname{font-weight:700}
.tag{font-size:14px;font-weight:700}
.tag.ok{color:var(--green)} .tag.warn{color:var(--red)} .tag.na{color:var(--ink2)}
.dnum{font-size:14px;color:var(--ink2);font-variant-numeric:tabular-nums}
.dcard svg{width:100%;height:auto;display:block;margin-top:6px}
.dcard details{margin-top:4px} .dcard summary{cursor:pointer;font-size:15px;color:var(--ink2);padding:4px 0}
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{text-align:right;padding:3px 4px;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{font-weight:600;color:var(--ink2)}
.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;margin:6px 0 10px}
.flow span{border:1.5px solid var(--teal);border-radius:999px;padding:5px 12px;background:#fff}
.flow b{color:var(--teal)}
.log{list-style:none;margin:8px 0 0;padding:0;font-size:14px}
.log li{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.log li span:first-child{overflow-wrap:anywhere}
ul.plain{margin:6px 0 0;padding-left:20px} ul.plain li{margin:3px 0}
.foot{margin-top:26px;font-size:14px;color:var(--ink2);text-align:center}

@media print{
  body{background:#fff}
  .tabs,.actions,.controls,.foot,details.presenter,[data-back]{display:none!important}
  .panel,.dcard{break-inside:avoid}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
'use strict';

/* ================================================================
   ANALYSIS: pure functions, no DOM. Everything here is original code
   written for this prototype using standard, published signal-processing
   ideas. No datasets, AI models or external services are used.
   Thresholds and drift settings are illustrative, NOT clinically validated.
   ================================================================ */
/* ANALYSIS-START */
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const clamp01 = x => clamp(x, 0, 1);
const mean = a => a.length ? a.reduce((s, v) => s + v, 0) / a.length : 0;
const sdp = a => { const m = mean(a); return Math.sqrt(mean(a.map(v => (v - m) * (v - m)))); };          // population SD
const sds = a => { if (a.length < 2) return 0; const m = mean(a); return Math.sqrt(a.reduce((s, v) => s + (v - m) * (v - m), 0) / (a.length - 1)); }; // sample SD
const median = a => { const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };

/* ---------- seeded random numbers (for simulators and tests) ---------- */
function mulberry32(a) {
  return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function gaussR(rng) { let u = 0; while (u === 0) u = rng(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rng()); }

/* ---------- signal helpers ---------- */
function resampleUniform(t, v, fs) {           // t in seconds (ascending) -> uniform grid at fs
  const N = Math.floor((t[t.length - 1] - t[0]) * fs), out = new Float64Array(N);
  let k = 0;
  for (let i = 0; i < N; i++) {
    const tt = t[0] + i / fs;
    while (k < t.length - 2 && t[k + 1] < tt) k++;
    const t0 = t[k], t1 = t[k + 1], w = t1 > t0 ? clamp01((tt - t0) / (t1 - t0)) : 0;
    out[i] = v[k] * (1 - w) + v[k + 1] * w;
  }
  return out;
}
function highpassMA(x, fs, winSec) {           // subtract a centred moving average
  const n = x.length, w = Math.max(1, Math.round(winSec * fs)), cs = new Float64Array(n + 1), out = new Float64Array(n);
  for (let i = 0; i < n; i++) cs[i + 1] = cs[i] + x[i];
  for (let i = 0; i < n; i++) { const a = Math.max(0, i - (w >> 1)), b = Math.min(n, i + (w >> 1) + 1); out[i] = x[i] - (cs[b] - cs[a]) / (b - a); }
  return out;
}
function dftAmp(x, fs, freqs) {                // Hann-windowed single-sided amplitude at chosen frequencies
  const N = x.length, w = new Float64Array(N);
  let ws = 0;
  for (let i = 0; i < N; i++) { w[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / (N - 1)); ws += w[i]; }
  return freqs.map(f => {
    let re = 0, im = 0; const om = 2 * Math.PI * f / fs;
    for (let i = 0; i < N; i++) { const xv = x[i] * w[i]; re += xv * Math.cos(om * i); im -= xv * Math.sin(om * i); }
    return 2 * Math.hypot(re, im) / ws;
  });
}

/* ---------- voice: pitch by normalised autocorrelation ---------- */
function detectPitch(buf, sr) {
  const n = buf.length;
  let e = 0;
  for (let i = 0; i < n; i++) e += buf[i] * buf[i];
  const rms = Math.sqrt(e / n);
  if (rms < 0.012) return { f0: 0, rms, conf: 0 };
  const minLag = Math.floor(sr / 400), maxLag = Math.min(Math.floor(sr / 70), (n >> 1) - 2), w = n - maxLag - 1;
  let e0 = 0;
  for (let i = 0; i < w; i++) e0 += buf[i] * buf[i];
  const corr = new Float32Array(maxLag + 2);
  let gmax = 0;
  for (let lag = minLag; lag <= maxLag; lag++) {
    let s = 0, e1 = 0;
    for (let i = 0; i < w; i++) { const b = buf[i + lag]; s += buf[i] * b; e1 += b * b; }
    const c = s / Math.sqrt(e0 * e1 + 1e-12);
    corr[lag] = c; if (c > gmax) gmax = c;
  }
  if (gmax < 0.6) return { f0: 0, rms, conf: gmax };
  let best = -1;
  for (let lag = minLag + 1; lag < maxLag; lag++) {
    if (corr[lag] >= 0.9 * gmax && corr[lag] > corr[lag - 1] && corr[lag] >= corr[lag + 1]) { best = lag; break; }
  }
  if (best < 0) return { f0: 0, rms, conf: gmax };
  const a = corr[best - 1], b = corr[best], c = corr[best + 1], den = a - 2 * b + c;
  return { f0: sr / (best + (den !== 0 ? 0.5 * (a - c) / den : 0)), rms, conf: b };
}
function analyzeVoice(frames, dt) {              // frames = [{rms, f0}] every dt seconds
  const voiced = frames.filter(f => f.f0 > 0), voicedSec = voiced.length * dt, diffs = [], f0s = [];
  for (let i = 0; i < frames.length; i++) {
    if (frames[i].f0 > 0) f0s.push(frames[i].f0);
    if (i > 0 && frames[i].f0 > 0 && frames[i - 1].f0 > 0) {
      const r = frames[i].f0 / frames[i - 1].f0;
      if (Math.abs(r - 1) < 0.2) diffs.push(Math.abs(frames[i].f0 - frames[i - 1].f0));
    }
  }
  if (voicedSec < 3 || diffs.length < 40) return { error: 'short', voicedSec };
  const idx = frames.map((f, i) => f.f0 > 0 ? i : -1).filter(i => i >= 0), first = idx[0], last = idx[idx.length - 1];
  const trim = Math.floor((last - first) * 0.1);
  const core = frames.slice(first + trim, last - trim + 1).filter(f => f.f0 > 0).map(f => f.rms);
  const f0Mean = mean(f0s);
  return { pitchInstab: mean(diffs) / f0Mean * 100, loudCV: core.length > 5 ? sdp(core) / mean(core) * 100 : 0, f0Mean, voicedSec };
}

/* ---------- spiral drawing ---------- */
function analyzeSpiral(pts, size) {              // pts = [{x, y, t(ms)}] in CSS px on a size x size canvas
  const cx = size / 2, cy = size / 2;
  const P = pts.filter(p => Math.hypot(p.x - cx, p.y - cy) > size * 0.04);
  if (P.length < 40) return { error: 'short' };
  const th = [];
  let prev = Math.atan2(P[0].y - cy, P[0].x - cx), acc = prev;
  th.push(acc);
  for (let i = 1; i < P.length; i++) {
    const a = Math.atan2(P[i].y - cy, P[i].x - cx);
    let d = a - prev;
    while (d > Math.PI) d -= 2 * Math.PI;
    while (d < -Math.PI) d += 2 * Math.PI;
    acc += d; prev = a; th.push(acc);
  }
  const total = th[th.length - 1] - th[0], dir = total >= 0 ? 1 : -1, turns = Math.abs(total) / (2 * Math.PI);
  const dur = (P[P.length - 1].t - P[0].t) / 1000;
  if (turns < 1 || dur < 3) return { error: 'short', turns, dur };
  const phi = th.map(v => (v - th[0]) * dir), r = P.map(p => Math.hypot(p.x - cx, p.y - cy));
  const n = P.length, mp = mean(phi), mr = mean(r);
  let sxx = 0, sxy = 0;
  for (let i = 0; i < n; i++) { sxx += (phi[i] - mp) ** 2; sxy += (phi[i] - mp) * (r[i] - mr); }
  const b = sxx > 0 ? sxy / sxx : 0, a = mr - b * mp;
  const e = r.map((v, i) => v - (a + b * phi[i]));
  const half = Math.PI / 8, ed = new Array(n);   // short moving average removes slow off-centre drift, keeps wobble and tremor
  for (let i = 0; i < n; i++) {
    let s = 0, c = 0;
    for (let j = i; j >= 0 && phi[i] - phi[j] <= half; j--) { s += e[j]; c++; }
    for (let j = i + 1; j < n && phi[j] - phi[i] <= half; j++) { s += e[j]; c++; }
    ed[i] = e[i] - s / c;
  }
  const irreg = Math.sqrt(mean(ed.map(v => v * v))) / mr * 100;
  const fs = 50, T = P.map(p => (p.t - P[0].t) / 1000), N = Math.floor(dur * fs), x = new Float64Array(N);
  let k = 0;
  for (let i = 0; i < N; i++) {
    const tt = i / fs;
    while (k < n - 2 && T[k + 1] < tt) k++;
    const t0 = T[k], t1 = T[k + 1], wgt = t1 > t0 ? clamp01((tt - t0) / (t1 - t0)) : 0;
    x[i] = ed[k] * (1 - wgt) + ed[k + 1] * wgt;
  }
  const mx = mean(Array.from(x)); for (let i = 0; i < N; i++) x[i] -= mx;
  const freqs = []; for (let f = 4; f <= 8.001; f += 0.25) freqs.push(f);
  const amps = dftAmp(x, fs, freqs);
  let peak = 0, peakHz = 0; amps.forEach((v, i) => { if (v > peak) { peak = v; peakHz = freqs[i]; } });
  return { irreg, tremorPct: peak / size * 100, tremorHz: peakHz, turns, dur };
}

/* ---------- finger tapping ---------- */
function analyzeTap(times, errors) {             // times = ms timestamps of correct alternating taps
  const n = times.length;
  if (n < 12) return { error: 'short', n };
  const iv = [];
  for (let i = 1; i < n; i++) iv.push(times[i] - times[i - 1]);
  const span = (times[n - 1] - times[0]) / 1000, t0 = times[0];
  const c1 = times.filter(t => (t - t0) / 1000 < span / 3).length, c3 = times.filter(t => (t - t0) / 1000 >= 2 * span / 3).length;
  const med = median(iv);
  return { rate: (n - 1) / span, cv: sdp(iv) / mean(iv), decr: c1 > 0 ? (c1 - c3) / c1 * 100 : 0, pauses: iv.filter(v => v > Math.max(2 * med, 500)).length, n, errors, span };
}

/* ---------- hand tremor from a 3-axis accelerometer (samples in m/s^2) ---------- */
function analyzeTremor(samples) {
  if (samples.length < 200) return { error: 'short' };
  const t = samples.map(s => (s.t - samples[0].t) / 1000), dur = t[t.length - 1], rate = (samples.length - 1) / dur;
  if (dur < 8 || rate < 30) return { error: 'short', dur, rate };
  const fs = 50, freqs = []; for (let f = 0.5; f <= 15.001; f += 0.25) freqs.push(f);
  const P = new Float64Array(freqs.length);
  for (const ax of ['x', 'y', 'z']) {
    let x = resampleUniform(t, samples.map(s => s[ax]), fs);
    x = highpassMA(x, fs, 1.0);
    x = x.slice(fs, x.length - fs);                                  // drop 1 s edge effects
    if (x.length < 200) return { error: 'short' };
    dftAmp(x, fs, freqs).forEach((a, i) => { P[i] += a * a; });      // combine axes as vector power
  }
  let peak = 0, peakHz = 0, band = 0, total = 0;
  freqs.forEach((f, i) => { if (f >= 4 && f <= 6.5) { band += P[i]; if (P[i] > peak) { peak = P[i]; peakHz = f; } } total += P[i]; });
  return { tremorAmp: Math.sqrt(peak) / 9.80665 * 1000, tremorHz: peakHz, tremorRatio: total > 0 ? band / total : 0, dur, rate };   // amplitude in milli-g
}

/* ---------- walking: step and stride regularity from acceleration magnitude ---------- */
function analyzeGait(samples) {
  if (samples.length < 300) return { error: 'short' };
  const t = samples.map(s => (s.t - samples[0].t) / 1000), dur = t[t.length - 1], rate = (samples.length - 1) / dur;
  if (dur < 15 || rate < 30) return { error: 'short', dur, rate };
  const fs = 50;
  let x = resampleUniform(t, samples.map(s => Math.hypot(s.x, s.y, s.z)), fs);
  x = highpassMA(x, fs, 2.0);
  x = x.slice(3 * fs, x.length - 3 * fs);                            // drop start/stop transients
  const N = x.length;
  if (N < 8 * fs) return { error: 'short' };
  const mx = mean(Array.from(x)); for (let i = 0; i < N; i++) x[i] -= mx;
  const maxLag = Math.min(Math.round(3 * fs), N - 20), ac = new Float64Array(maxLag + 2);
  for (let l = 0; l <= maxLag; l++) { let s = 0; for (let i = 0; i + l < N; i++) s += x[i] * x[i + l]; ac[l] = s / (N - l); }   // unbiased autocorrelation
  const r0 = ac[0];
  if (!(r0 > 1e-9)) return { error: 'flat' };
  for (let l = 0; l <= maxLag; l++) ac[l] /= r0;
  const peakIn = (a, b) => {
    let best = -1, bv = -Infinity;
    for (let l = Math.max(1, a); l <= Math.min(b, maxLag - 1); l++) if (ac[l] > ac[l - 1] && ac[l] >= ac[l + 1] && ac[l] > bv) { bv = ac[l]; best = l; }
    return best < 0 ? null : { lag: best, v: bv };
  };
  const s1 = peakIn(Math.round(0.35 * fs), Math.round(0.85 * fs));
  if (!s1) return { error: 'nogait' };
  const s2 = peakIn(Math.round(1.7 * s1.lag), Math.round(2.3 * s1.lag));
  if (!s2) return { error: 'nogait' };
  if (s2.v < 0.15) return { error: 'nogait' };
  const a = ac[s2.lag - 1], b = ac[s2.lag], c = ac[s2.lag + 1], den = a - 2 * b + c;
  const strideSec = (s2.lag + (den !== 0 ? 0.5 * (a - c) / den : 0)) / fs;
  // step-time variability from detected step peaks
  const w = Math.max(1, Math.round(0.08 * fs)), sm = new Float64Array(N);
  for (let i = 0; i < N; i++) { let s = 0, n = 0; for (let j = Math.max(0, i - w); j <= Math.min(N - 1, i + w); j++) { s += x[j]; n++; } sm[i] = s / n; }
  const thr = 0.35 * sdp(Array.from(sm)), minD = Math.round(0.3 * fs), peaks = [];
  for (let i = 1; i < N - 1; i++) {
    if (sm[i] > thr && sm[i] >= sm[i - 1] && sm[i] > sm[i + 1]) {
      if (peaks.length && i - peaks[peaks.length - 1] < minD) { if (sm[i] > sm[peaks[peaks.length - 1]]) peaks[peaks.length - 1] = i; }
      else peaks.push(i);
    }
  }
  const ivs = []; for (let i = 1; i < peaks.length; i++) ivs.push((peaks[i] - peaks[i - 1]) / fs);
  if (ivs.length < 12) return { error: 'nogait' };
  const med = median(ivs), kept = ivs.filter(v => v < 1.6 * med && v > 0.55 * med);
  return { cadence: 120 / strideSec, strideReg: s2.v, stepReg: s1.v, symmetry: s1.v / s2.v, stepCV: sdp(kept) / mean(kept), steps: peaks.length, dur };
}

/* ---------- personal-baseline drift engine ---------- */
const DOMAINS = {
  voice:  { label: 'Voice',                        feats: [ { k: 'pitchInstab', label: 'Pitch variation', unit: '%', worse: 'up', floor: 0.35 },
                                                             { k: 'loudCV', label: 'Loudness variation', unit: '%', worse: 'up', floor: 3 } ] },
  spiral: { label: 'Spiral drawing',               feats: [ { k: 'irreg', label: 'Shape irregularity', unit: '% radius', worse: 'up', floor: 0.4 },
                                                             { k: 'tremorPct', label: 'Tremor-band amplitude', unit: '% canvas', worse: 'up', floor: 0.04 } ] },
  tap:    { label: 'Finger tapping',               feats: [ { k: 'rate', label: 'Tapping rate', unit: '/s', worse: 'down', floor: 0.25 },
                                                             { k: 'cv', label: 'Rhythm variability', unit: '', worse: 'up', floor: 0.03 },
                                                             { k: 'decr', label: 'Slowing over test', unit: '%', worse: 'up', floor: 4 } ] },
  tremor: { label: 'Hand tremor (motion sensor)',  feats: [ { k: 'tremorAmp', label: 'Tremor-band amplitude', unit: 'mg', worse: 'up', floor: 1.5 },
                                                             { k: 'tremorRatio', label: 'Tremor-band share', unit: '', worse: 'up', floor: 0.05 } ], extra: ['tremorHz'] },
  gait:   { label: 'Walking (motion sensor)',      feats: [ { k: 'cadence', label: 'Cadence', unit: 'steps/min', worse: 'down', floor: 3 },
                                                             { k: 'strideReg', label: 'Stride regularity', unit: '', worse: 'down', floor: 0.04 },
                                                             { k: 'stepCV', label: 'Step-time variability', unit: '', worse: 'up', floor: 0.02 } ], extra: ['stepReg', 'symmetry'] },
  quiz:   { label: 'Symptom questions',            feats: [ { k: 'points', label: 'Symptom points', unit: '/ 14', worse: 'up', floor: 0.8 } ] }
};
const K_SLACK = 0.5, H_LIMIT = 4, Z_CLAMP = 5, BASE_LIVE = 3, BASE_SIM = 4, SAFETY_POINTS = 8;
const fv = (s, dom, k) => { const d = s.features && s.features[dom]; return d && typeof d[k] === 'number' && isFinite(d[k]) ? d[k] : null; };

function analyseSessions(sessions, baseN) {
  const n = sessions.length;
  const res = { n, baseN, phase: n < baseN ? 'building' : n === baseN ? 'ready' : 'monitoring', domains: {}, flagged: [], firstReviewAt: -1, safetyNet: false, status: '' };
  for (const dom of Object.keys(DOMAINS)) {
    const feats = DOMAINS[dom].feats, stats = {};
    for (const f of feats) {
      const vals = sessions.slice(0, baseN).map(s => fv(s, dom, f.k)).filter(v => v != null);
      if (n >= baseN && vals.length >= 2) stats[f.k] = { mu: mean(vals), sd: Math.max(sds(vals), f.floor) };
    }
    const z = [], S = [];
    let cs = 0, alarmAt = -1;
    sessions.forEach((s, i) => {
      const zs = [];
      feats.forEach(f => {
        const st = stats[f.k], v = fv(s, dom, f.k);
        if (st && v != null) { let zz = (v - st.mu) / st.sd; if (f.worse === 'down') zz = -zz; zs.push(clamp(zz, -Z_CLAMP, Z_CLAMP)); }
      });
      const zd = zs.length ? mean(zs) : null;
      z.push(zd);
      if (i >= baseN) {
        if (zd != null) { cs = Math.max(0, cs + zd - K_SLACK); if (cs >= H_LIMIT && alarmAt < 0) alarmAt = i; }
        S.push(cs);
      } else S.push(null);
    });
    const last = n - 1, lastS = res.phase === 'monitoring' ? S[last] : null;
    const rows = feats.map(f => {
      const st = stats[f.k], v = last >= 0 ? fv(sessions[last], dom, f.k) : null;
      let zl = null; if (st && v != null) { zl = (v - st.mu) / st.sd; if (f.worse === 'down') zl = -zl; }
      return { k: f.k, label: f.label, unit: f.unit, mu: st ? st.mu : null, sd: st ? st.sd : null, latest: v, z: zl };
    });
    res.domains[dom] = { z, S, alarmAt, latestZ: z[last] != null ? z[last] : null, latestS: lastS, flagged: lastS != null && lastS >= H_LIMIT, rows };
  }
  if (res.phase === 'monitoring') {
    for (let i = baseN; i < n; i++) {
      const c = Object.keys(DOMAINS).filter(d => res.domains[d].S[i] != null && res.domains[d].S[i] >= H_LIMIT).length;
      if (c >= 2) { res.firstReviewAt = i; break; }
    }
    res.flagged = Object.keys(DOMAINS).filter(d => res.domains[d].flagged);
    res.status = res.flagged.length >= 2 ? 'review' : res.flagged.length === 1 ? 'watch' : 'stable';
  } else res.status = res.phase;
  if (n) { const q = fv(sessions[n - 1], 'quiz', 'points'); res.safetyNet = q != null && q >= SAFETY_POINTS; }
  return res;
}

const BASE_PROFILE = {
  voice:  { pitchInstab: [1.0, 0.3], loudCV: [12, 2.5] },
  spiral: { irreg: [1.2, 0.3], tremorPct: [0.08, 0.02] },

  tremor: { tremorAmp: [4, 1.2], tremorRatio: [0.25, 0.04] },
  gait:   { cadence: [108, 2.5], strideReg: [0.85, 0.03], stepCV: [0.04, 0.01] },
  quiz:   { points: [2, 0.8] }
};
const DRIFT_END = {
  voice:  { pitchInstab: 1.2, loudCV: 8 },
  spiral: { irreg: 1.4, tremorPct: 0.12 },
  tap:    { rate: -0.9, cv: 0.07, decr: 11 },
  tremor: { tremorAmp: 8, tremorRatio: 0.15 },
  gait:   { cadence: -8, strideReg: -0.10, stepCV: 0.03 },
  quiz:   { points: 5 }
};
const BOUNDS = { pitchInstab: [0.1, 30], loudCV: [2, 80], irreg: [0.2, 30], tremorPct: [0.01, 5], rate: [1, 9], cv: [0.02, 1], decr: [-15, 70],
                 tremorAmp: [0.5, 400], tremorRatio: [0.02, 0.95], cadence: [60, 160], strideReg: [0.05, 0.98], stepCV: [0.005, 0.5], points: [0, 14] };
function sampleFeatures(rng, ramp) {             // one synthetic session; ramp 0..1 scales the drift
  const f = {};
  for (const dom of Object.keys(BASE_PROFILE)) {
    f[dom] = {};
    for (const k of Object.keys(BASE_PROFILE[dom])) {
      const [m, s] = BASE_PROFILE[dom][k];
      let v = m + s * gaussR(rng) + ((DRIFT_END[dom] || {})[k] || 0) * ramp;
      const b = BOUNDS[k]; if (b) v = clamp(v, b[0], b[1]);

    }
  }

}
function makePersona(kind, weeks, seed) {
  const rng = mulberry32(seed), out = [];
  for (let w = 1; w <= weeks; w++) out.push({ id: 'w' + w, label: 'W' + w, time: null, sim: true, features: sampleFeatures(rng, kind === 'drift' ? clamp01((w - 5) / 6) : 0) });
  return out;
}
function simTremorSamples(ampMg, hz, rng) {      // 20 s at ~60 Hz, gravity included, with a little physiological tremor and noise
  const A = ampMg * 9.80665 / 1000, ph = rng() * 6.28, ph2 = rng() * 6.28, out = [];
  for (let i = 0; i < 20 * 60; i++) {
    const t = i / 60, s = A * Math.sin(2 * Math.PI * hz * t + ph), phys = 0.0015 * 9.80665 * Math.sin(2 * Math.PI * 10 * t + ph2);
    out.push({ t: 1000 * t + 2 * rng(), x: 0.35 * s + 0.4 * phys + 0.012 * gaussR(rng), y: 0.9 + 0.25 * s + 0.3 * phys + 0.012 * gaussR(rng), z: 9.6 + s + phys + 0.012 * gaussR(rng) });
  }
  return out;
}
function simGaitSamples(cadence, cv, noise, rng) {   // 30 s at ~60 Hz
  const stepT = 60 / cadence, times = [];
  let tt = 0.3; while (tt < 32) { times.push(tt); tt += stepT * (1 + cv * gaussR(rng)); }
  const out = [];
  for (let i = 0; i < 30 * 60; i++) {
    const t = i / 60; let a = 0;
    for (let j = 0; j < times.length; j++) { const d = t - times[j]; if (Math.abs(d) < 0.25) a += (j % 2 === 0 ? 3.2 : 2.7) * Math.exp(-(d * d) / (2 * 0.045 * 0.045)); }
    a += 0.6 * Math.sin(Math.PI * t / stepT) + noise * gaussR(rng);
    out.push({ t: 1000 * t + 2 * rng(), x: 0.5 * a, y: 0.3 * a, z: 9.6 + a });
  }
  return out;
}

/* ================================================================
   IoT LAYER: an in-page publish/subscribe broker with MQTT-style topics.
   It stands in for an MQTT broker plus cloud store. Only compact feature
   vectors are published; raw audio, touch and motion data stay on the device.
   ================================================================ */
const Bus = (() => {
  const subs = [], log = [];
  const match = (pat, topic) => {
    const p = pat.split('/'), t = topic.split('/');
    for (let i = 0; i < p.length; i++) { if (p[i] === '#') return true; if (i >= t.length) return false; if (p[i] !== '+' && p[i] !== t[i]) return false; }
    return p.length === t.length;
  };
  return {
    log, match,
    subscribe(pat, fn) { subs.push({ pat, fn }); },
    publish(topic, payload, meta) {
      meta = meta || {};
      const msg = { topic, payload, bytes: JSON.stringify(payload).length, rawBytes: meta.rawBytes || 0, t: Date.now(), sim: !!meta.sim };
      log.push(msg); if (log.length > 300) log.shift();
      subs.forEach(s => { if (match(s.pat, topic)) s.fn(msg); });
      return msg;
    },
    stats() { return { n: log.length, sent: log.reduce((s, m) => s + m.bytes, 0), raw: log.reduce((s, m) => s + m.rawBytes, 0) }; }
  };
})();
const Cloud = { sessions: [], pending: {} };
Bus.subscribe('dw/+/+/#', msg => {
  const parts = msg.topic.split('/'), sid = parts[2], dom = parts[3];
  if (dom === 'summary') {
    Cloud.sessions.push({ id: sid, label: 'S' + (Cloud.sessions.length + 1), time: msg.payload.time, sim: !!msg.payload.sim, features: Cloud.pending[sid] || {} });
    delete Cloud.pending[sid];
  } else { (Cloud.pending[sid] = Cloud.pending[sid] || {})[dom] = msg.payload; }
});

    const ok = await ensureMotion();
    if (!ok) { msg('The motion sensor is unavailable or permission was denied. Open this page on a phone over https, or use simulated data.'); btn.disabled = false; return; }

      const a = (e.accelerationIncludingGravity && e.accelerationIncludingGravity.x != null) ? e.accelerationIncludingGravity : e.acceleration;

      const rows = d.rows.filter(r => r.latest != null).map(r => `<tr><td>${esc(r.label)}</td><td>${r.mu != null ? f2(r.mu) : '–'}</td><td>${f2(r.latest)}</td><td>${r.z != null ? (r.z >= 0 ? '+' : '') + f1(r.z) : '–'}</td></tr>`).join('');
      const dnum = d.latestS != null ? `Drift score ${f1(d.latestS)} of ${H_LIMIT} (flag at ${H_LIMIT})`
        : a.phase !== 'monitoring' ? (haveRaw ? `Recorded. Building baseline (${a.n} of ${baseN} sessions).` : 'No data yet.')
        : haveZ ? 'Waiting for monitored sessions' : 'No data yet';
      return `<div class="dcard ${d.flagged ? 'flag' : ''}"><div class="dhead"><span class="dname">${esc(DOMAINS[dom].label)}</span>${tag}</div>
        <div class="dnum">${dnum}</div>
        ${haveZ ? sparkline(a, dom, baseN, n) : ''}
        ${rows ? `<details><summary>Baseline and latest values</summary><table class="tbl"><tr><th></th><th>Baseline</th><th>Latest</th><th>z</th></tr>${rows}</table></details>` : ''}</div>`;
    }).join('');
    const st = Bus.stats(), last = Bus.log.slice(-8).reverse();
    const iot = `<div class="panel"><h3>IoT data flow</h3>
      <div class="flow"><span>Phone sensors</span><b>then</b><span>Edge features</span><b>then</b><span>Broker</span><b>then</b><span>This dashboard</span></div>
      ${st.n ? `<p>${st.n} messages so far. Raw data kept on the device: about ${kb(st.raw)}. Sent to the dashboard: ${kb(st.sent)}.</p>` : '<p>No messages yet. Complete a session in the Patient tab.</p>'}
      ${last.length ? `<ul class="log">${last.map(m => `<li><span>${esc(m.topic)}</span><span>${m.bytes} B${m.sim ? ' (sim)' : ''}</span></li>`).join('')}</ul>` : ''}
      <p class="fine">The broker runs inside this page and stands in for MQTT over TLS to a cloud service.</p></div>`;
    return `<section><h2>Clinician dashboard</h2>
      <p class="lead">Each area is compared with the person’s own baseline. A flag needs sustained drift, and review is advised only when two areas drift together.</p>
      <div class="controls"><label for="src">Data source</label><select id="src">
        <option value="live" ${src === 'live' ? 'selected' : ''}>Live sessions (this device)</option>
        <option value="stable" ${src === 'stable' ? 'selected' : ''}>Simulated: 12 weeks, stable person</option>
        <option value="drift" ${src === 'drift' ? 'selected' : ''}>Simulated: 12 weeks, gradual drift</option></select></div>
      ${src !== 'live' ? '<div class="banner sim">Simulated data. It shows how the method behaves. It says nothing about clinical accuracy.</div>' : ''}
      ${S.demo && src === 'live' ? `<div class="controls"><button class="btn small" id="addNormal" type="button">Add simulated normal session</button><button class="btn small" id="addDrift" type="button">Add simulated drifted session</button><button class="btn small" id="resetLive" type="button">Reset live data</button></div>` : ''}
      ${banner}${a.safetyNet ? '<div class="banner watch">Safety net: the latest symptom answers were high (' + SAFETY_POINTS + ' or more points of 14). Advise a doctor visit regardless of drift.</div>' : ''}
      <div class="dgrid">${cards}</div>${iot}
      <div class="panel"><h3>Methods and what this uses</h3>
        <ul class="plain">
          <li>Hand tremor: 3-axis accelerometer at 50 Hz, high-pass filter, Hann-windowed spectrum, peak amplitude and power share in the 4 to 6.5 Hz band.</li>
          <li>Walking: acceleration magnitude, autocorrelation for step and stride regularity (after Moe-Nilssen and Helbostad, 2004), cadence from the stride period.</li>
          <li>Voice, spiral and tapping: the measures from the first prototype.</li>
          <li>Drift: each measure as a z-score against the person’s own baseline (with a minimum spread), averaged per area, then a one-sided CUSUM (Page, 1954) with slack 0.5 and limit 4.</li>
          <li>Resources: browser microphone, touch and motion sensors only. No datasets, AI models or external services. Simulated data comes from synthetic generators in this file.</li>
        </ul>
        <p class="fine">Limits: a screening aid, not a diagnosis. Settings are illustrative and not clinically validated. Phone sensors vary between devices, and tiredness, medicines, phone position and other conditions affect results. Clinical validation is required before real use.</p></div>
      <div class="actions"><button class="btn" id="printBtn" type="button">Print or save summary</button></div></section>`;
  },
  mount() {
    $('#src').addEventListener('change', e => { S.source = e.target.value; render(); });
    $('#printBtn').addEventListener('click', () => window.print());
    const an = $('#addNormal'), ad = $('#addDrift'), rs = $('#resetLive');
    if (an) an.addEventListener('click', () => { simSession(false); render(); });
    if (ad) ad.addEventListener('click', () => { simSession(true); render(); });
    if (rs) rs.addEventListener('click', () => { Cloud.sessions.length = 0; Cloud.pending = {}; Bus.log.length = 0; S.sid = 0; render(); });
  }
};

render();
</script>
</body>
</html>
