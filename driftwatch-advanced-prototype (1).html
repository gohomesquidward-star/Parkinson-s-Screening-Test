<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5B3FA8">
<title>ParkinSense: personal-baseline early screening prototype</title>
<style>
:root{
  --ink:#261A47; --ink2:#4B4766; --mist:#F1EFF6; --paper:#fff; --line:#D8D3E4; --silver:#B9B6C8;
  --teal:#5B3FA8; --tealD:#472F8A; --tealT:#EDE8F8;   /* primary purple (awareness colour); variable names kept from the first version */
  --blue:#2F6FD0; --blueT:#E5EEFC; --violet:#2F6FD0; --tulip:#D2232A;
  --green:#23744A; --greenBar:#3FA06A; --greenTint:#E4F3EA;
  --amber:#9A5B00; --amberBar:#D9901A; --amberTint:#FBEFD9;
  --red:#B83227; --redBar:#D2493C; --redTint:#F9E3E0;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--mist);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.55}
.wrap{max-width:600px;margin:0 auto;padding:14px 18px 36px}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px;border-radius:6px}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 0 12px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-weight:700;font-size:21px;line-height:1.15;display:flex;align-items:center;gap:10px}
.brand .mark svg{width:36px;height:36px;display:block}
.brand small{display:block;font-family:var(--sans);font-weight:500;font-size:13px;color:var(--ink2)}
.tabs{display:flex;gap:6px;background:var(--paper);border:1.5px solid var(--ink);border-radius:999px;padding:4px;margin:0 0 16px}
.tabs button{flex:1;border:0;background:transparent;font:inherit;font-weight:600;font-size:16px;padding:9px 12px;border-radius:999px;color:var(--ink);cursor:pointer;min-height:44px}
.tabs button[aria-selected="true"]{background:var(--ink);color:#fff}

h1,h2,h3{font-family:var(--serif);line-height:1.15;letter-spacing:-.01em;margin:0}
h1{font-size:clamp(28px,8vw,40px);margin:6px 0 10px}
h2{font-size:27px;margin:2px 0 8px}
h3{font-size:19px;margin:0 0 4px}
.lead{font-size:18px;color:var(--ink2);margin:0 0 16px}
p{margin:0 0 12px}
.fine{font-size:14px;color:var(--ink2);margin:8px 0 0}

.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin:0 0 14px}
.panel p:last-child{margin-bottom:0}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0 4px}
.btn{font:inherit;font-weight:600;font-size:17px;min-height:52px;padding:12px 24px;border-radius:999px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--tealD);border-color:var(--tealD)}
.btn.small{min-height:44px;padding:8px 16px;font-size:15px}
.btn.text{border-color:transparent;background:transparent;text-decoration:underline;padding:10px 8px;min-height:44px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.msg{min-height:1.4em;color:var(--red);font-weight:600;margin:10px 0 0}

.hero{display:grid;grid-template-columns:92px 1fr;gap:14px;align-items:center;margin:4px 0 12px}
.hero svg{width:92px;height:92px}
.hero .ghost{fill:none;stroke:var(--line);stroke-width:2.2;stroke-dasharray:1 5;stroke-linecap:round}
.hero .draw{fill:none;stroke:var(--teal);stroke-width:3;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.4s cubic-bezier(.3,.6,.3,1) .15s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.hero .draw{animation:none;stroke-dashoffset:0}}

.check{display:flex;gap:12px;align-items:flex-start;margin:6px 0 4px;cursor:pointer}
.check input{width:24px;height:24px;margin-top:2px;accent-color:var(--teal);flex:none}
details.presenter{margin-top:22px;font-size:15px;color:var(--ink2)}
details.presenter summary{cursor:pointer;padding:6px 0}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 12px}
.tile{text-align:left;font:inherit;padding:14px 14px 12px;border-radius:16px;border:2px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;min-height:118px;display:flex;flex-direction:column;gap:2px}
.tile b{font-family:var(--serif);font-size:19px;line-height:1.2}
.tile span{font-size:14px;color:var(--ink2)}
.tile .st{margin-top:auto;font-weight:700;font-size:14px;color:var(--ink2)}
.tile.done{border-color:var(--teal);background:var(--tealT)}
.tile.done .st{color:var(--tealD)}

.scope{background:var(--ink);border-radius:14px;padding:10px;margin:0 0 12px}
.scope canvas{display:block;width:100%;height:150px}
.status{color:#CFE0FF;font-size:15px;min-height:1.5em;padding:2px 4px 0}
.timer{display:flex;align-items:center;gap:12px;margin:0 0 4px}
.bar{flex:1;height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--blue)}
.secs{font-family:var(--serif);font-size:26px;min-width:5.5em;text-align:right;font-variant-numeric:tabular-nums}
.secs small{font-family:var(--sans);font-size:14px;color:var(--ink2)}

.spiralbox{background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:8px;margin:0 0 10px;display:flex;justify-content:center}
.spiralbox canvas{touch-action:none;cursor:crosshair;border-radius:10px;background:#fff;display:block}
.taps{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:8px 0 12px;user-select:none;-webkit-user-select:none}
.tapbtn{aspect-ratio:1/1;border-radius:50%;border:4px solid var(--line);background:var(--paper);color:var(--ink2);touch-action:manipulation;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tapbtn.next{border-color:var(--teal);background:var(--tealT)}
.tapbtn:active{transform:scale(.97)}
.hint{font-size:16px;color:var(--ink2);text-align:center;margin:0 0 8px}

.qcount{color:var(--ink2);font-size:15px;margin:0 0 6px}
.qtext{font-family:var(--serif);font-size:24px;line-height:1.3;margin:0 0 16px}
.opts{display:grid;gap:10px}
.opt{font:inherit;font-size:19px;font-weight:600;text-align:left;padding:16px 18px;min-height:58px;border-radius:14px;border:2px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.opt[aria-checked="true"]{border-color:var(--teal);background:var(--tealT)}

.done{background:var(--greenTint);border-radius:14px;padding:14px 16px;margin:10px 0 0}
.done strong{display:block;color:var(--green)}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 16px;margin:6px 0 0;font-size:15px}
.kv dt{color:var(--ink2)} .kv dd{margin:0;font-variant-numeric:tabular-nums;font-weight:600;text-align:right}

.banner{border-radius:14px;padding:14px 16px;margin:0 0 14px;font-weight:600}
.banner small{display:block;font-weight:500;margin-top:4px}
.banner.building,.banner.ready{background:var(--blueT);border:1px solid #C5D7F5;color:var(--ink)}
.banner.stable{background:var(--greenTint);color:var(--green)}
.banner.watch{background:var(--amberTint);color:var(--amber)}
.banner.review{background:var(--redTint);color:var(--red)}
.banner.sim{background:var(--amberTint);color:var(--amber);font-weight:600}

.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 12px}
.controls label{font-size:15px;color:var(--ink2)}
select{font:inherit;padding:9px 12px;border-radius:10px;border:1.5px solid var(--ink);background:#fff;color:var(--ink);min-height:44px}
.dgrid{display:grid;gap:10px;margin:0 0 14px}
.dcard{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.dcard.flag{border-color:var(--redBar);background:#FFF9F8}
.dhead{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.dname{font-weight:700}
.tag{font-size:14px;font-weight:700}
.tag.ok{color:var(--green)} .tag.warn{color:var(--red)} .tag.na{color:var(--ink2)}
.tag.typical{color:var(--green)} .tag.borderline{color:var(--amber)} .tag.outside{color:var(--red)}
.meter{height:10px;background:var(--mist);border-radius:5px;overflow:hidden;margin:8px 0 4px}
.meter i{display:block;height:100%;border-radius:5px}
.meter i.typical{background:var(--greenBar)} .meter i.borderline{background:var(--amberBar)} .meter i.outside{background:var(--redBar)}
.dnum{font-size:14px;color:var(--ink2);font-variant-numeric:tabular-nums}
.dcard svg{width:100%;height:auto;display:block;margin-top:6px}
.dcard details{margin-top:4px} .dcard summary{cursor:pointer;font-size:15px;color:var(--ink2);padding:4px 0}
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{text-align:right;padding:3px 4px;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{font-weight:600;color:var(--ink2)}
.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;margin:6px 0 10px}
.flow span{border:1.5px solid var(--teal);border-radius:999px;padding:5px 12px;background:#fff}
.flow b{color:var(--teal)}
.log{list-style:none;margin:8px 0 0;padding:0;font-size:14px}
.log li{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.log li span:first-child{overflow-wrap:anywhere}
ul.plain{margin:6px 0 0;padding-left:20px} ul.plain li{margin:3px 0}
.foot{margin-top:26px;font-size:14px;color:var(--ink2);text-align:center}

.fld{display:block;margin:0 0 12px;font-size:14px;font-weight:600;color:var(--ink2)}
.fld input{display:block;width:100%;margin-top:6px;font:inherit;font-size:17px;font-weight:400;padding:12px 14px;border-radius:12px;border:2px solid var(--ink);background:#fff;color:var(--ink);min-height:50px}
.acctrow{margin:0 0 10px}
.langsel{font-size:15px;min-height:40px;padding:6px 10px;max-width:11em}
/* Indian scripts have tall marks above and below the line, so give them more room and no tight tracking */
html:not([lang="en"]) h1,html:not([lang="en"]) h2,html:not([lang="en"]) h3{line-height:1.4;letter-spacing:0}
html:not([lang="en"]) .qtext{line-height:1.5}
html:not([lang="en"]) body{line-height:1.7}
html:not([lang="en"]) .brand small{line-height:1.5}
.hands{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 6px}
.hands .opt{text-align:center;min-height:52px;padding:10px 6px;font-size:16px;line-height:1.25}
.hands .opt:disabled{opacity:.6;cursor:default}
.report{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px;margin:0 0 14px}
.rp-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border-bottom:2px solid var(--teal);padding-bottom:8px;margin-bottom:10px}
.rp-head svg{width:34px;height:34px;flex:none}
.report h2{font-size:23px;margin:0 0 4px}
.report h3{font-size:16px;margin:14px 0 6px}
.report p,.report .banner{font-size:14px}
.report .banner{padding:8px 12px;margin:0 0 6px}
.rp-meta{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;font-size:14px;margin:0}
.rp-meta dt{color:var(--ink2)} .rp-meta dd{margin:0;font-weight:600}
.rp-scroll{overflow-x:auto}
.rp-tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.rp-tbl th,.rp-tbl td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}
.rp-tbl th{color:var(--ink2);font-weight:600}
.rp-tbl .tag{font-size:13px}
@media print{
  @page{size:A4;margin:12mm}
  .wrap.rep header.top,.noprint{display:none!important}
  .wrap.rep{max-width:none;padding:0}
  .report{border:0;padding:0;margin:0}
  .report h2{font-size:19px} .report h3{font-size:13px;margin:9px 0 4px}
  .report p,.report .banner,.rp-meta{font-size:11px} .rp-tbl,.rp-tbl .tag{font-size:10.5px}
  .rp-tbl th,.rp-tbl td{padding:3px 5px}
  .banner,.tag{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .wrap.rep,.wrap.rep .report{line-height:1.38}
  .wrap.rep .report h2{line-height:1.25} .wrap.rep .report h3{line-height:1.25}
  .rp-head{padding-bottom:5px;margin-bottom:6px} .report .banner{padding:5px 10px;margin:0 0 4px}
  .rp-tbl .tag{font-size:10px} .report .fine{font-size:10px}
  body{background:#fff}
  .tabs,.actions,.controls,.foot,details.presenter,[data-back]{display:none!important}
  .panel,.dcard{break-inside:avoid}
}
</style>

<body>
<div id="app"></div>

<script>
'use strict';

/* ================================================================
   ANALYSIS: pure functions, no DOM. Everything here is original code
   written for this prototype using standard, published signal-processing
   ideas. No datasets, AI models or external services are used.
   Thresholds and drift settings are illustrative, NOT clinically validated.
   ================================================================ */
/* ANALYSIS-START */
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const clamp01 = x => clamp(x, 0, 1);
const mean = a => a.length ? a.reduce((s, v) => s + v, 0) / a.length : 0;
const sdp = a => { const m = mean(a); return Math.sqrt(mean(a.map(v => (v - m) * (v - m)))); };          // population SD
const sds = a => { if (a.length < 2) return 0; const m = mean(a); return Math.sqrt(a.reduce((s, v) => s + (v - m) * (v - m), 0) / (a.length - 1)); }; // sample SD
const median = a => { const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };

/* ---------- seeded random numbers (for simulators and tests) ---------- */
function mulberry32(a) {
  return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function gaussR(rng) { let u = 0; while (u === 0) u = rng(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rng()); }

/* ---------- signal helpers ---------- */
function resampleUniform(t, v, fs) {           // t in seconds (ascending) -> uniform grid at fs
  const N = Math.floor((t[t.length - 1] - t[0]) * fs), out = new Float64Array(N);
  let k = 0;
  for (let i = 0; i < N; i++) {
    const tt = t[0] + i / fs;
    while (k < t.length - 2 && t[k + 1] < tt) k++;
    const t0 = t[k], t1 = t[k + 1], w = t1 > t0 ? clamp01((tt - t0) / (t1 - t0)) : 0;
    out[i] = v[k] * (1 - w) + v[k + 1] * w;
  }
  return out;
}
function highpassMA(x, fs, winSec) {           // subtract a centred moving average
  const n = x.length, w = Math.max(1, Math.round(winSec * fs)), cs = new Float64Array(n + 1), out = new Float64Array(n);
  for (let i = 0; i < n; i++) cs[i + 1] = cs[i] + x[i];
  for (let i = 0; i < n; i++) { const a = Math.max(0, i - (w >> 1)), b = Math.min(n, i + (w >> 1) + 1); out[i] = x[i] - (cs[b] - cs[a]) / (b - a); }
  return out;
}
function dftAmp(x, fs, freqs) {                // Hann-windowed single-sided amplitude at chosen frequencies
  const N = x.length, w = new Float64Array(N);
  let ws = 0;
  for (let i = 0; i < N; i++) { w[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / (N - 1)); ws += w[i]; }
  return freqs.map(f => {
    let re = 0, im = 0; const om = 2 * Math.PI * f / fs;
    for (let i = 0; i < N; i++) { const xv = x[i] * w[i]; re += xv * Math.cos(om * i); im -= xv * Math.sin(om * i); }
    return 2 * Math.hypot(re, im) / ws;
  });
}

/* ---------- voice: pitch by normalised autocorrelation ---------- */
function detectPitch(buf, sr) {
  const n = buf.length;
  let e = 0;
  for (let i = 0; i < n; i++) e += buf[i] * buf[i];
  const rms = Math.sqrt(e / n);
  if (rms < 0.012) return { f0: 0, rms, conf: 0 };
  const minLag = Math.floor(sr / 400), maxLag = Math.min(Math.floor(sr / 70), (n >> 1) - 2), w = n - maxLag - 1;
  let e0 = 0;
  for (let i = 0; i < w; i++) e0 += buf[i] * buf[i];
  const corr = new Float32Array(maxLag + 2);
  let gmax = 0;
  for (let lag = minLag; lag <= maxLag; lag++) {
    let s = 0, e1 = 0;
    for (let i = 0; i < w; i++) { const b = buf[i + lag]; s += buf[i] * b; e1 += b * b; }
    const c = s / Math.sqrt(e0 * e1 + 1e-12);
    corr[lag] = c; if (c > gmax) gmax = c;
  }
  if (gmax < 0.6) return { f0: 0, rms, conf: gmax };
  let best = -1;
  for (let lag = minLag + 1; lag < maxLag; lag++) {
    if (corr[lag] >= 0.9 * gmax && corr[lag] > corr[lag - 1] && corr[lag] >= corr[lag + 1]) { best = lag; break; }
  }
  if (best < 0) return { f0: 0, rms, conf: gmax };
  const a = corr[best - 1], b = corr[best], c = corr[best + 1], den = a - 2 * b + c;
  return { f0: sr / (best + (den !== 0 ? 0.5 * (a - c) / den : 0)), rms, conf: b };
}
function analyzeVoice(frames, dt) {              // frames = [{rms, f0}] every dt seconds
  const voiced = frames.filter(f => f.f0 > 0), voicedSec = voiced.length * dt, diffs = [], f0s = [];
  for (let i = 0; i < frames.length; i++) {
    if (frames[i].f0 > 0) f0s.push(frames[i].f0);
    if (i > 0 && frames[i].f0 > 0 && frames[i - 1].f0 > 0) {
      const r = frames[i].f0 / frames[i - 1].f0;
      if (Math.abs(r - 1) < 0.2) diffs.push(Math.abs(frames[i].f0 - frames[i - 1].f0));
    }
  }
  if (voicedSec < 3 || diffs.length < 40) return { error: 'short', voicedSec };
  const idx = frames.map((f, i) => f.f0 > 0 ? i : -1).filter(i => i >= 0), first = idx[0], last = idx[idx.length - 1];
  const trim = Math.floor((last - first) * 0.1);
  const core = frames.slice(first + trim, last - trim + 1).filter(f => f.f0 > 0).map(f => f.rms);
  const f0Mean = mean(f0s);
  return { pitchInstab: mean(diffs) / f0Mean * 100, loudCV: core.length > 5 ? sdp(core) / mean(core) * 100 : 0, f0Mean, voicedSec };
}

/* ---------- spiral drawing ---------- */
function analyzeSpiral(pts, size) {              // pts = [{x, y, t(ms)}] in CSS px on a size x size canvas
  const cx = size / 2, cy = size / 2;
  const P = pts.filter(p => Math.hypot(p.x - cx, p.y - cy) > size * 0.04);
  if (P.length < 40) return { error: 'short' };
  const th = [];
  let prev = Math.atan2(P[0].y - cy, P[0].x - cx), acc = prev;
  th.push(acc);
  for (let i = 1; i < P.length; i++) {
    const a = Math.atan2(P[i].y - cy, P[i].x - cx);
    let d = a - prev;
    while (d > Math.PI) d -= 2 * Math.PI;
    while (d < -Math.PI) d += 2 * Math.PI;
    acc += d; prev = a; th.push(acc);
  }
  const total = th[th.length - 1] - th[0], dir = total >= 0 ? 1 : -1, turns = Math.abs(total) / (2 * Math.PI);
  const dur = (P[P.length - 1].t - P[0].t) / 1000;
  if (turns < 1 || dur < 3) return { error: 'short', turns, dur };
  const phi = th.map(v => (v - th[0]) * dir), r = P.map(p => Math.hypot(p.x - cx, p.y - cy));
  const n = P.length, mp = mean(phi), mr = mean(r);
  let sxx = 0, sxy = 0;
  for (let i = 0; i < n; i++) { sxx += (phi[i] - mp) ** 2; sxy += (phi[i] - mp) * (r[i] - mr); }
  const b = sxx > 0 ? sxy / sxx : 0, a = mr - b * mp;
  const e = r.map((v, i) => v - (a + b * phi[i]));
  const half = Math.PI / 8, ed = new Array(n);   // short moving average removes slow off-centre drift, keeps wobble and tremor
  for (let i = 0; i < n; i++) {
    let s = 0, c = 0;
    for (let j = i; j >= 0 && phi[i] - phi[j] <= half; j--) { s += e[j]; c++; }
    for (let j = i + 1; j < n && phi[j] - phi[i] <= half; j++) { s += e[j]; c++; }
    ed[i] = e[i] - s / c;
  }
  const irreg = Math.sqrt(mean(ed.map(v => v * v))) / mr * 100;
  const fs = 50, T = P.map(p => (p.t - P[0].t) / 1000), N = Math.floor(dur * fs), x = new Float64Array(N);
  let k = 0;
  for (let i = 0; i < N; i++) {
    const tt = i / fs;
    while (k < n - 2 && T[k + 1] < tt) k++;

/* ---------- finger tapping ---------- */

/* ---------- walking: step and stride regularity from acceleration magnitude ---------- */
function analyzeGait(samples) {

  if (dur < 15 || rate < 30) return { error: 'short', dur, rate };

}

function analyseSessions(sessions, baseN) {

      let zl = null; if (st && v != null) { zl = (v - st.mu) / st.sd; if (f.worse === 'down') zl = -zl; }
      return { k: f.k, label: f.label, unit: f.unit, mu: st ? st.mu : null, sd: st ? st.sd : null, latest: v, z: zl };
    });

}

/* ================================================================
   IoT LAYER: an in-page publish/subscribe broker with MQTT-style topics.
   It stands in for an MQTT broker plus cloud store. Only compact feature
   vectors are published; raw audio, touch and motion data stay on the device.
   ================================================================ */
const Bus = (() => {
  const subs = [], log = [];
  const match = (pat, topic) => {
    const p = pat.split('/'), t = topic.split('/');
    for (let i = 0; i < p.length; i++) { if (p[i] === '#') return true; if (i >= t.length) return false; if (p[i] !== '+' && p[i] !== t[i]) return false; }
    return p.length === t.length;
  };
  return {
    log, match,
    subscribe(pat, fn) { subs.push({ pat, fn }); },
    publish(topic, payload, meta) {
      meta = meta || {};
      const msg = { topic, payload, bytes: JSON.stringify(payload).length, rawBytes: meta.rawBytes || 0, t: Date.now(), sim: !!meta.sim };
      log.push(msg); if (log.length > 300) log.shift();
      subs.forEach(s => { if (match(s.pat, topic)) s.fn(msg); });
      return msg;
    },
    stats() { return { n: log.length, sent: log.reduce((s, m) => s + m.bytes, 0), raw: log.reduce((s, m) => s + m.rawBytes, 0) }; }
  };
})();
const Cloud = { sessions: [], pending: {} };
Bus.subscribe('dw/+/+/#', msg => {
  const parts = msg.topic.split('/'), sid = parts[2], dom = parts[3];
  if (dom === 'summary') {
    Cloud.sessions.push({ id: sid, label: 'S' + (Cloud.sessions.length + 1), time: msg.payload.time, sim: !!msg.payload.sim, level: msg.payload.level, hand: msg.payload.hand, features: Cloud.pending[sid] || {} });
    delete Cloud.pending[sid];
    Auth.persist();
  } else { (Cloud.pending[sid] = Cloud.pending[sid] || {})[dom] = msg.payload; }
});

 "iot.then": "பிறகு",
 "iot.msgs": "இதுவரை {n} செய்திகள். தொலைபேசியில் வைத்திருக்கும் மூலத் தரவு: சுமார் {a}. டாஷ்போர்டுக்கு அனுப்பியது: {b}.",
 "iot.none": "இந்த வருகையில் இன்னும் செய்தி எதுவும் அனுப்பப்படவில்லை. நோயாளி தாவலில் ஓர் அமர்வை முடியுங்கள்.",

 "iot.fine": "ப்ரோக்கர் இந்தப் பக்கத்துக்குள்ளேயே இயங்குகிறது; கிளவுட் சேவைக்கு TLS மீது MQTT செய்யும் வேலையை இது ஏற்கிறது.",
 "cl.m.h": "முறைகளும் பயன்படுத்தியவையும்",
 "cl.m.1": "கை நடுக்கம்: 50 ஹெர்ட்ஸில் 3-அச்சு முடுக்கமானி, ஹை-பாஸ் வடிகட்டி, ஹான்-சாளரம் இட்ட அலைநிரல், 4 முதல் 6.5 ஹெர்ட்ஸ் அலைவரிசையில் உச்ச வீச்சும் ஆற்றல் பங்கும்.",
 "cl.m.2": "நடை: முடுக்கத்தின் அளவு, அடிகள் மற்றும் எட்டுச் சுழற்சியின் ஒழுங்குக்கான தன்னொட்டுறவு (மோ-நில்சென், ஹெல்போஸ்டாட், 2004 படி), சுழற்சிக் காலத்திலிருந்து அடிகளின் வேகம்.",
 "cl.m.3": "குரல், சுருள், தட்டுதல்: முதல் முன்மாதிரியில் இருந்த அதே அளவீடுகள்.",
 "cl.m.4": "முதல் நாள் முடிவு: இன்றைய அளவீடுகளை எடுத்துக்காட்டாக வைத்த வழக்கமான வரம்புகளுடன் ஒப்பிடுவது; அமர்வு சேமிக்கப்பட்டதும் உடனே காட்டப்படும். மருத்துவரைப் பார்க்க ஆலோசனை வழங்க இரண்டு பகுதிகள் வரம்புக்கு வெளியே இருக்க வேண்டும், அல்லது அறிகுறி மதிப்பெண் அதிகமாக இருக்க வேண்டும்.",
 "cl.m.5": "குடும்ப அறிக்கை: பயனருக்கு நெருக்கமான ஒருவர் அதே ஏழு கேள்விகளுக்குப் பதிலளிக்கிறார். இரண்டு மதிப்பெண்களில் அதிகமானது எடுத்துக்கொள்ளப்படும்; பெரிய வேறுபாடு குறிக்கப்படும்.",
 "cl.m.6": "மாற்றம்: ஒவ்வொரு அளவீடும் அந்த நபரின் சொந்த வழக்கமான நிலைக்கு எதிராக z-மதிப்பாக மாற்றப்படுகிறது (குறைந்தபட்சப் பரவலுடன்), பகுதிவாரியாகச் சராசரி எடுக்கப்படுகிறது, பிறகு ஒருதிசை CUSUM (பேஜ், 1954) பயன்படுத்தப்படுகிறது; தளர்வு 0.5, வரம்பு 4.",
 "cl.m.7": "வளங்கள்: உலாவியின் மைக்ரோஃபோன், தொடுதல், இயக்க உணரிகள் மட்டுமே. தரவுத்தொகுப்புகள், AI மாதிரிகள், வெளிச் சேவைகள் எதுவும் இல்லை. போலித் தரவு இந்தக் கோப்பிலுள்ள செயற்கை உருவாக்கிகளிலிருந்து வருகிறது.",
 "cl.m.limits": "வரம்புகள்: இது ஆரம்பநிலை பரிசோதனைக்கான உதவி மட்டுமே, நோய் கண்டறிதல் அல்ல. அமைப்புகள் எடுத்துக்காட்டுக்கானவை, மருத்துவ ரீதியாகச் சரிபார்க்கப்படவில்லை. தொலைபேசிக்குத் தொலைபேசி உணரிகள் மாறுபடும்; சோர்வு, மருந்துகள், தொலைபேசியைப் பிடிக்கும் நிலை, பிற நிலைமைகள் முடிவுகளைப் பாதிக்கும். உண்மையான பயன்பாட்டுக்கு முன் மருத்துவச் சரிபார்ப்பு அவசியம்.",

    cv.width = cw * dpr; cv.height = ch * dpr;
    const g = cv.getContext('2d'); g.scale(dpr, dpr);
    const flat = () => { g.clearRect(0, 0, cw, ch); g.strokeStyle = '#6B6389'; g.lineWidth = 2; g.beginPath(); g.moveTo(0, ch / 2); g.lineTo(cw, ch / 2); g.stroke(); };
    flat();

      const goBtn = $('#vgo'), msg = $('#vmsg'); msg.textContent = ''; goBtn.disabled = true;
      if (!window.isSecureContext) { msg.textContent = tx('v.local'); goBtn.disabled = false; return; }
      let stream;
      try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } }); }
      catch (e) { msg.textContent = tx('v.mic'); goBtn.disabled = false; return; }
      const AC = window.AudioContext || window.webkitAudioContext, ctx = new AC();
      try { if (ctx.state === 'suspended') await ctx.resume(); } catch (e) { /* ignore */ }
      const src = ctx.createMediaStreamSource(stream), an = ctx.createAnalyser();
      an.fftSize = 2048; src.connect(an);
      const buf = new Float32Array(an.fftSize), frames = [], DUR = 10000, t0 = performance.now();
      let stopped = false, timer = null;
      const stop = () => { if (stopped) return; stopped = true; clearInterval(timer); stream.getTracks().forEach(tr => tr.stop()); ctx.close().catch(() => {}); };
      S.cleanup = stop;
      $('#vstatus').textContent = tx('v.listen');

        an.getFloatTimeDomainData(buf);
        const r = detectPitch(buf, ctx.sampleRate);

        g.clearRect(0, 0, cw, ch); g.strokeStyle = r.f0 ? '#8EC5FF' : '#A9A4C2'; g.lineWidth = 2; g.beginPath();
        const step = buf.length / cw;
        for (let x = 0; x < cw; x++) { const v = buf[Math.floor(x * step)] * 3, y = ch / 2 - clamp(v, -1, 1) * (ch / 2 - 6); if (x) g.lineTo(x, y); else g.moveTo(x, y); }
        g.stroke();
        const el = performance.now() - t0;
        $('#vbar').style.width = Math.min(100, el / DUR * 100) + '%';
        $('#vsec').textContent = Math.max(0, Math.ceil((DUR - el) / 1000));
        if (el >= DUR) {
          const sr = ctx.sampleRate; stop(); S.cleanup = null;
          const m = analyzeVoice(frames, DUR / 1000 / frames.length);
          $('#vstatus').textContent = '';
          if (m.error) { msg.textContent = tx('v.short'); goBtn.disabled = false; goBtn.textContent = tx('btn.retry'); flat(); $('#vbar').style.width = '0'; $('#vsec').textContent = '10'; return; }

      <p class="msg" id="smsg" role="alert"></p></section>`;
  },
  mount() {
    const cv = $('#spiral'), dpr = window.devicePixelRatio || 1;
    const size = Math.floor(Math.min(cv.parentElement.clientWidth - 16, 440)) || 320;
    cv.style.width = cv.style.height = size + 'px'; cv.width = cv.height = size * dpr;
    const g = cv.getContext('2d'); g.scale(dpr, dpr);
    const guide = () => {
      g.clearRect(0, 0, size, size); g.fillStyle = '#C9C3DB';
      const rMax = size * 0.46, steps = 420;
      for (let i = 0; i <= steps; i++) { const th = i / steps * 3 * 2 * Math.PI, r = rMax * i / steps; g.beginPath(); g.arc(size / 2 + r * Math.cos(th), size / 2 + r * Math.sin(th), 2.4, 0, 2 * Math.PI); g.fill(); }
      g.fillStyle = '#5B3FA8'; g.beginPath(); g.arc(size / 2, size / 2, 6, 0, 2 * Math.PI); g.fill();
    };
    guide();
    let pts = [], drawing = false, last = null;
    const add = e => {
      const rc = cv.getBoundingClientRect(), p = { x: e.clientX - rc.left, y: e.clientY - rc.top, t: e.timeStamp };
      if (pts.length && p.t <= pts[pts.length - 1].t) return;
      pts.push(p);
      g.strokeStyle = '#261A47'; g.lineWidth = 3; g.lineCap = 'round'; g.lineJoin = 'round';
      g.beginPath(); if (last) g.moveTo(last.x, last.y); else g.moveTo(p.x, p.y); g.lineTo(p.x, p.y); g.stroke();
      last = p;
    };
    cv.addEventListener('pointerdown', e => { e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (x) { /* ignore */ } drawing = true; last = null; $('#smsg').textContent = ''; add(e); });
    cv.addEventListener('pointermove', e => { if (!drawing) return; e.preventDefault(); const list = e.getCoalescedEvents ? e.getCoalescedEvents() : []; (list.length ? list : [e]).forEach(add); });
    const end = () => { drawing = false; };
    cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
    const finishWith = (m, raw, sim) => {
      S.cur.spiral = Object.assign({}, m, { rawBytes: raw, sim });
      $('#szone').innerHTML = doneBox(`<strong>${tx('s.rec', { turns: f1(m.turns), dur: f1(m.dur) })}</strong>` + kv([[fl('spiral', 'irreg'), f1(m.irreg) + ' ' + tx('u.radius')], [fl('spiral', 'tremorPct'), f2(m.tremorPct) + ' ' + tx('u.canvas')]]) + (sim ? '<p class="fine">' + tx('c.sim') + '</p>' : ''));
      $('#nextBtn').addEventListener('click', () => go('home'));
    };
    $('#sclear').addEventListener('click', () => { pts = []; last = null; guide(); $('#smsg').textContent = ''; });
    $('#sdone').addEventListener('click', () => {

        }, 100);
      }
      if (which === expected) { times.push(now); expected = expected === 'L' ? 'R' : 'L'; paint(); } else errors++;
    };

    L.addEventListener('pointerdown', e => { e.preventDefault(); tap('L'); });
    R.addEventListener('pointerdown', e => { e.preventDefault(); tap('R'); });

function sensorHTML(title, lead, secs, note) {
  return `<section>${backBtn()}<h2>${title}</h2><p class="lead">${lead}</p>
    <div class="scope"><canvas id="ksig" aria-hidden="true"></canvas><div class="status" id="kstatus" aria-live="polite"></div></div>
    <div class="timer"><div class="bar"><i id="kbar"></i></div><div class="secs"><span id="ksec">${secs}</span> <small>${tx('unit.seconds')}</small></div></div>
    <div id="kzone"><div class="actions"><button class="btn primary" id="kgo" type="button">${tx('m.start')}</button>${simBtn()}</div></div>
    <p class="msg" id="kmsg" role="alert"></p><p class="fine">${note}</p></section>`;
}
function mountSensor(cfg) {
  const cv = $('#ksig'), dpr = window.devicePixelRatio || 1, cw = cv.clientWidth || 480, ch = 150;
  cv.width = cw * dpr; cv.height = ch * dpr;
  const g = cv.getContext('2d'); g.scale(dpr, dpr);
  const flat = () => { g.clearRect(0, 0, cw, ch); g.strokeStyle = '#6B6389'; g.lineWidth = 2; g.beginPath(); g.moveTo(0, ch / 2); g.lineTo(cw, ch / 2); g.stroke(); };
  flat();
  const msg = t => { $('#kmsg').textContent = t; };
  const finishWith = (m, count, sim) => {
    S.cur[cfg.key] = Object.assign({}, m, { rawBytes: count * 32, sim });
    $('#kzone').innerHTML = doneBox(`<strong>${cfg.doneText(m)}</strong>` + kv(cfg.doneRows(m)) + `<p class="fine">${sim ? tx('c.simSignal') + ' ' : ''}${tx('c.compare', { n: BASE_LIVE })}</p>`);
    $('#nextBtn').addEventListener('click', () => go('home'));
  };
  const sb = $('#sampleBtn');
  if (sb) sb.addEventListener('click', () => {
    const smp = cfg.simulate(), m = cfg.analyze(smp);
    if (m.error) { msg(tx('m.simfail')); return; }
    finishWith(m, smp.length, true);
  });
  $('#kgo').addEventListener('click', async () => {
    const btn = $('#kgo'); msg(''); btn.disabled = true;
    if (!window.isSecureContext) { msg(tx('m.local')); btn.disabled = false; return; }
    const ok = await ensureMotion();
    if (!ok) { msg(tx('m.denied')); btn.disabled = false; return; }
    const samples = [], live = [], start = performance.now();
    let stopped = false, timer = null;
    const onMotion = e => {
      const a = (e.accelerationIncludingGravity && e.accelerationIncludingGravity.x != null) ? e.accelerationIncludingGravity : e.acceleration;
      if (!a || a.x == null) return;
      const el = (performance.now() - start) / 1000;
      live.push(Math.hypot(a.x, a.y, a.z)); if (live.length > 240) live.shift();
      if (el >= cfg.lead && el <= cfg.lead + cfg.dur) samples.push({ t: e.timeStamp, x: a.x, y: a.y, z: a.z });
    };
    window.addEventListener('devicemotion', onMotion);
    const stop = () => { if (stopped) return; stopped = true; clearInterval(timer); window.removeEventListener('devicemotion', onMotion); };
    S.cleanup = stop;
    if (navigator.vibrate) navigator.vibrate(120);
    timer = setInterval(() => {
      const el = (performance.now() - start) / 1000;
      g.clearRect(0, 0, cw, ch);
      if (live.length > 2) {
        const mu = mean(live), sc = (ch / 2 - 8) / cfg.plotScale;
        g.strokeStyle = '#8EC5FF'; g.lineWidth = 2; g.beginPath();
        live.forEach((v, i) => { const x = i / 239 * cw, y = ch / 2 - clamp((v - mu) * sc, -ch / 2 + 6, ch / 2 - 6); if (i) g.lineTo(x, y); else g.moveTo(x, y); });
        g.stroke();
      } else flat();
      if (el < cfg.lead) { $('#kstatus').textContent = cfg.leadText(Math.ceil(cfg.lead - el)); $('#ksec').textContent = cfg.dur; $('#kbar').style.width = '0'; }
      else { const r = el - cfg.lead; $('#kstatus').textContent = tx('m.recording'); $('#kbar').style.width = Math.min(100, r / cfg.dur * 100) + '%'; $('#ksec').textContent = Math.max(0, Math.ceil(cfg.dur - r)); }
      if (el > 2.5 && live.length === 0) { stop(); S.cleanup = null; msg(tx('m.nodata')); btn.disabled = false; $('#kstatus').textContent = ''; return; }
      if (el >= cfg.lead + cfg.dur) {
        stop(); S.cleanup = null; $('#kstatus').textContent = '';
        const m = cfg.analyze(samples);
        if (m.error) { msg(cfg.failText); btn.disabled = false; btn.textContent = tx('btn.retry'); $('#kbar').style.width = '0'; return; }
        finishWith(m, samples.length, false);
      }
    }, 60);
  });
}

  if (baseN > 0 && n > 0) { const bw = n <= 1 ? iw : (Math.min(baseN, n) - 1) * iw / (n - 1) + iw / (2 * Math.max(1, n - 1)); s += `<rect x="${pl}" y="${pt}" width="${Math.min(iw, bw)}" height="${ih}" fill="#EFEBF7"/>`; }
  s += `<line x1="${pl}" x2="${W - pr}" y1="${y(H_LIMIT)}" y2="${y(H_LIMIT)}" stroke="#B83227" stroke-dasharray="4 4" stroke-width="1.5"/>`;
  d.z.forEach((v, i) => { if (v != null && i >= baseN) { const h = Math.max(1, ih * clamp(Math.max(v, 0), 0, ymax) / ymax); s += `<rect x="${x(i) - 3}" y="${pt + ih - h}" width="6" height="${h}" fill="#D8D3E4"/>`; } });
  const pts = d.S.map((v, i) => v == null ? null : x(i).toFixed(1) + ',' + y(v).toFixed(1)).filter(Boolean);
  if (pts.length) s += `<polyline fill="none" stroke="${d.flagged ? '#B83227' : '#5B3FA8'}" stroke-width="2.5" points="${pts.join(' ')}"/>`;
  return s + '</svg>';
}
VIEWS.clinic = {
  html() {
    const src = S.source, sessions = getSessions(), baseN = src === 'live' ? BASE_LIVE : BASE_SIM, a = analyseSessions(sessions, baseN), n = sessions.length;
    const names = a.flagged.map(d => dl(d));
    let banner;
    if (a.phase === 'building') banner = `<div class="banner building">${tx('cl.b.building', { n: a.n, N: baseN })}<small>${src === 'live' ? tx('cl.b.buildingSmall') : ''}</small></div>`;
    else if (a.phase === 'ready') banner = `<div class="banner ready">${tx('cl.b.ready', { N: baseN })}<small>${tx('cl.b.readySmall')}</small></div>`;
    else if (a.status === 'stable') banner = `<div class="banner stable">${tx('cl.b.stable')}<small>${tx('cl.b.stableSmall', { n: n - baseN })}</small></div>`;
    else if (a.status === 'watch') banner = `<div class="banner watch">${tx('cl.b.watch', { a: esc(names[0]) })}<small>${tx('cl.b.watchSmall')}</small></div>`;
    else banner = `<div class="banner review">${tx('cl.b.review', { a: esc(names.join(', ')), first: a.firstReviewAt >= 0 ? tx('cl.b.first', { l: esc(sessions[a.firstReviewAt].label) }) : '' })}<small>${tx('cl.b.reviewSmall')}</small></div>`;
    const cards = Object.keys(DOMAINS).map(dom => {
      const d = a.domains[dom], haveZ = d.z.some(v => v != null), haveRaw = d.rows.some(r => r.latest != null);
      const tag = (a.phase !== 'monitoring' || d.baseCount < baseN) ? '<span class="tag na">' + tx('cl.tag.base') + '</span>' : d.flagged ? '<span class="tag warn">' + tx('cl.tag.drift') + '</span>' : '<span class="tag ok">' + tx('cl.tag.stable') + '</span>';
      const rows = d.rows.filter(r => r.latest != null).map(r => `<tr><td>${esc(fl(dom, r.k))}</td><td>${r.mu != null ? f2(r.mu) : '–'}</td><td>${f2(r.latest)}</td><td>${r.z != null ? (r.z >= 0 ? '+' : '') + f1(r.z) : '–'}</td></tr>`).join('');
      const dnum = d.latestS != null ? tx('cl.dnum.score', { s: f1(d.latestS), H: H_LIMIT })
        : (a.phase !== 'monitoring' || d.baseCount < baseN) ? (haveRaw ? tx('cl.dnum.rec', { n: d.baseCount, N: baseN }) : tx('cl.dnum.none'))
        : haveZ ? tx('cl.dnum.wait') : tx('cl.dnum.none');
      let famNote = '';
      if (dom === 'quiz' && n > 0) {
        const qf = sessions[n - 1].features && sessions[n - 1].features.quiz;
        if (qf && typeof qf.selfPts === 'number' && typeof qf.famPts === 'number') famNote = `<div class="dnum">${tx('cl.fam.both', { a: qf.selfPts, b: qf.famPts, gap: Math.abs(qf.famPts - qf.selfPts) >= 3 ? tx('cl.fam.gap') : '' })}</div>`;
        else if (qf && typeof qf.famPts === 'number') famNote = `<div class="dnum">${tx('cl.fam.only', { b: qf.famPts })}</div>`;
      }
      if (dom === 'tap' && src === 'live') { const hn = handNote(sessions); if (hn) famNote = `<div class="dnum" style="color:var(--amber);font-weight:600">${hn}</div>`; }
      return `<div class="dcard ${d.flagged ? 'flag' : ''}"><div class="dhead"><span class="dname">${esc(dl(dom))}</span>${tag}</div>
        <div class="dnum">${dnum}</div>${famNote}
        ${haveZ ? sparkline(a, dom, baseN, n) : ''}
        ${rows ? `<details><summary>${tx('cl.tbl.sum')}</summary><table class="tbl"><tr><th></th><th>${tx('cl.tbl.base')}</th><th>${tx('cl.tbl.latest')}</th><th>z</th></tr>${rows}</table></details>` : ''}</div>`;
    }).join('');
    const st = Bus.stats(), last = Bus.log.slice(-8).reverse();
    const iot = `<div class="panel"><h3>${tx('iot.h')}</h3>
      <div class="flow"><span>${tx('iot.f1')}</span><b>${tx('iot.then')}</b><span>${tx('iot.f2')}</span><b>${tx('iot.then')}</b><span>${tx('iot.f3')}</span><b>${tx('iot.then')}</b><span>${tx('iot.f4')}</span></div>
      ${st.n ? `<p>${tx('iot.msgs', { n: st.n, a: kb(st.raw), b: kb(st.sent) })}</p>` : '<p>' + tx('iot.none') + '</p>'}
      ${last.length ? `<ul class="log">${last.map(m => `<li><span>${esc(m.topic)}</span><span>${m.bytes} B${m.sim ? ' ' + tx('iot.sim') : ''}</span></li>`).join('')}</ul>` : ''}
      <p class="fine">${tx('iot.fine')}</p></div>`;
    return `<section><h2>${tx('cl.h')}</h2>
      <p class="lead">${tx('cl.lead')}</p>
      <div class="controls"><label for="src">${tx('cl.src')}</label><select id="src">
        <option value="live" ${src === 'live' ? 'selected' : ''}>${tx('cl.src.live')}</option>
        <option value="stable" ${src === 'stable' ? 'selected' : ''}>${tx('cl.src.stable')}</option>
        <option value="drift" ${src === 'drift' ? 'selected' : ''}>${tx('cl.src.drift')}</option></select></div>
      ${src !== 'live' ? '<div class="banner sim">' + tx('cl.simBanner') + '</div>' : ''}
      ${S.demo && src === 'live' ? `<div class="controls"><button class="btn small" id="addNormal" type="button">${tx('cl.addNormal')}</button><button class="btn small" id="addDrift" type="button">${tx('cl.addDrift')}</button><button class="btn small" id="resetLive" type="button">${tx('cl.reset')}</button></div>` : ''}
      ${banner}${a.safetyNet ? '<div class="banner watch">' + tx('cl.safety', { p: SAFETY_POINTS }) + '</div>' : ''}
      <div class="dgrid">${cards}</div>${iot}
      <div class="panel"><h3>${tx('cl.m.h')}</h3>
        <ul class="plain">${[1, 2, 3, 4, 5, 6, 7].map(i => '<li>' + tx('cl.m.' + i) + '</li>').join('')}</ul>
        <p class="fine">${tx('cl.m.limits')}</p></div>
      <div class="actions">${src === 'live' && n ? `<button class="btn primary" id="toReport" type="button">${tx('rp.btn')}</button>` : ''}<button class="btn" id="printBtn" type="button">${tx('cl.print')}</button></div></section>`;
  },
  mount() {
    $('#src').addEventListener('change', e => { S.source = e.target.value; render(); });
    $('#printBtn').addEventListener('click', () => window.print());
    const tr = $('#toReport'); if (tr) tr.addEventListener('click', () => go('report'));
    const an = $('#addNormal'), ad = $('#addDrift'), rs = $('#resetLive');
    if (an) an.addEventListener('click', () => { simSession(false); render(); });
    if (ad) ad.addEventListener('click', () => { simSession(true); render(); });
    if (rs) rs.addEventListener('click', () => { if (S.user && !window.confirm(tx('cl.resetConfirm'))) return; Cloud.sessions.length = 0; Cloud.pending = {}; Bus.log.length = 0; S.sid = 0; Auth.persist(); render(); });
  }
};

if (Auth.restore()) S.screen = 'home';
render();
</script>
</body>
